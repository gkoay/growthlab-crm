  // ========== EXPORT CSV ==========
  function exportCSV(data, filename) {
    const headers = ['name','email','company','source','persona','track','lifecycleStage','geography','createdDate','lastActivityDate','notes'];
    const esc = s => String(s||'').split('"').join('""');
    const rows = data.map(c => headers.map(h => `"${esc(c[h])}"`).join(','));
    const csv = [headers.join(','), ...rows].join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename || 'contacts.csv'; a.click();
    URL.revokeObjectURL(url);
  }

  function saveNewContact() {
    const d = modalData;
    if (!d.name?.trim() || !d.email?.trim()) { alert('Name and Email are required'); return; }
    if (contacts.find(c => c.email.toLowerCase() === d.email.toLowerCase())) { alert('A contact with this email already exists'); return; }
    contacts.push({
      id: 'new_' + Date.now(),
      name: d.name.trim(),
      email: d.email.trim(),
      company: d.company?.trim() || '',
      source: d.source || 'Manual',
      persona: d.persona || 'Founder',
      track: d.track || 'Self-serve',
      lifecycleStage: d.lifecycleStage || 'Lead',
      geography: d.geography?.trim() || '',
      createdDate: today(),
      lastActivityDate: today(),
      notes: d.notes?.trim() || '',
      activities: [{ date: today(), type: 'import', desc: 'Added manually' }]
    });
    closeModal();
    renderContacts();
  }

  // ========== CHANGE STAGE ==========
  function showChangeStage(contactId) {
    const contact = contacts.find(c => c.id === contactId);
    if (!contact) return;
    const stagesByTrack = {
      'Self-serve': ['Lead','Signed up','Activated','PQL','Pro customer'],
      'Events': ['Lead','Registered','Attended','Re-engaged'],
      'Enterprise': ['Lead','In conversation','Qualified']
    };
    modalMode = 'changeStage';
    modalData = { contactId, currentStage: contact.lifecycleStage, stages: stagesByTrack[contact.track] || [], contactName: contact.name };
    renderModal();
  }

  function saveStageChange() {
    const { contactId, newStage } = modalData;
    const contact = contacts.find(c => c.id === contactId);
    if (!contact || !newStage) return;
    const oldStage = contact.lifecycleStage;
    contact.lifecycleStage = newStage;
    contact.lastActivityDate = today();
    contact.activities.push({ date: today(), type: 'stage', desc: `${oldStage} → ${newStage}` });
    closeModal();
    showContact(contactId);
  }

  // ========== ADD NOTE ==========

  function saveNote() {
    const { contactId, note } = modalData;
    if (!note?.trim()) return;
    const contact = contacts.find(c => c.id === contactId);
    if (!contact) return;
    contact.notes = contact.notes ? contact.notes + '\n' + note.trim() : note.trim();
    contact.lastActivityDate = today();
    contact.activities.push({ date: today(), type: 'note', desc: note.trim() });
    closeModal();
    showContact(contactId);
  }

    const filterFn = c => {

      if (d.source && c.source !== d.source) return false;
      if (d.track && c.track !== d.track) return false;
      if (d.geography && c.geography !== d.geography) return false;
      return true;
    };
    presetSegments.push({
      id: 'custom_' + Date.now(),
      name: d.name.trim(),
      description: d.description?.trim() || '',
      filter: filterFn
    });

  // ========== DASHBOARD ==========
  function renderDashboard() {
    const bySource = {}, byPersona = {}, byTrack = {}, byGeo = {};
    contacts.forEach(c => {
      bySource[c.source] = (bySource[c.source]||0)+1;
      byPersona[c.persona] = (byPersona[c.persona]||0)+1;
      byTrack[c.track] = (byTrack[c.track]||0)+1;
      byGeo[c.geography] = (byGeo[c.geography]||0)+1;
    });
    const newWeek = contacts.filter(c=>new Date(c.createdDate)>=new Date(daysAgo(7))).length;
    const activeEnt = contacts.filter(c=>c.track==='Enterprise'&&['In conversation','Qualified'].includes(c.lifecycleStage)).length;
    const pro = contacts.filter(c=>c.lifecycleStage==='Pro customer').length;

    const barHtml = (data, color) => {
      const max = Math.max(...Object.values(data),1);
      return Object.entries(data).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`
        <div><div class="flex justify-between text-xs mb-1"><span class="text-ink-2">${k}</span><span class="font-medium text-ink-1">${v}</span></div>
        <div class="w-full bg-surface-2 rounded-full h-2"><div class="h-2 rounded-full" style="width:${(v/max)*100}%;background:${color||'#22c55e'}"></div></div></div>
      `).join('');
    };

    const recent = [...contacts].sort((a,b)=>new Date(b.createdDate)-new Date(a.createdDate)).slice(0,5);

    document.getElementById('main').innerHTML = `
      <div class="p-8 fade-in">
        <div class="mb-8"><h1 class="text-2xl font-bold text-ink-1">Dashboard</h1><p class="text-sm text-ink-3 mt-1">Overview of all GrowthLab contacts and pipeline activity</p></div>
        <div class="grid grid-cols-4 gap-4 mb-8">
          ${statCard('Total Contacts',contacts.length,'All time','+8 this week',true,'👥')}
          ${statCard('New This Week',newWeek,'Last 7 days','+40% vs last week',true,'📈')}
          ${statCard('Enterprise Pipeline',activeEnt,'Active conversations','','','🏢')}
          ${statCard('Pro Customers',pro,'Paying subscribers','Growing',true,'⭐')}
        </div>
        <div class="grid grid-cols-2 gap-4 mb-8">
          <div class="bg-surface-0 rounded-xl border border-surface-3 p-5"><h3 class="text-sm font-semibold text-ink-1 mb-4">Contacts by Source</h3><div class="space-y-3">${barHtml(bySource)}</div></div>
          <div class="bg-surface-0 rounded-xl border border-surface-3 p-5"><h3 class="text-sm font-semibold text-ink-1 mb-4">Contacts by Track</h3><div class="space-y-3">${barHtml(byTrack,'#22c55e')}</div></div>
        </div>
        <div class="grid grid-cols-2 gap-4 mb-8">
          <div class="bg-surface-0 rounded-xl border border-surface-3 p-5"><h3 class="text-sm font-semibold text-ink-1 mb-4">Contacts by Persona</h3><div class="space-y-3">${barHtml(byPersona,'#6366f1')}</div></div>
          <div class="bg-surface-0 rounded-xl border border-surface-3 p-5"><h3 class="text-sm font-semibold text-ink-1 mb-4">Contacts by Geography</h3><div class="space-y-3">${barHtml(byGeo,'#f59e0b')}</div></div>
        </div>
        <div class="bg-surface-0 rounded-xl border border-surface-3 p-5">
          <h3 class="text-sm font-semibold text-ink-1 mb-4">Recent Contacts</h3>
          <table class="w-full text-sm"><thead><tr class="text-left text-xs text-ink-3 border-b border-surface-3"><th class="pb-2">Name</th><th class="pb-2">Source</th><th class="pb-2">Track</th><th class="pb-2">Stage</th><th class="pb-2">Added</th></tr></thead>
          <tbody>${recent.map(c=>`<tr class="border-b border-surface-2"><td class="py-2.5 font-medium text-ink-1">${c.name}</td><td class="py-2.5 text-ink-2">${c.source}</td><td class="py-2.5"><span class="px-2 py-0.5 rounded-full text-xs ${trackColor(c.track)}">${c.track}</span></td><td class="py-2.5"><span class="px-2 py-0.5 rounded-full text-xs ${stageBadge(c.lifecycleStage)}">${c.lifecycleStage}</span></td><td class="py-2.5 text-ink-3">${c.createdDate}</td></tr>`).join('')}</tbody></table>
        </div>
      </div>
    `;
  }

  function statCard(label,value,subtitle,trend,trendUp,icon) {
    return `<div class="bg-surface-0 rounded-xl border border-surface-3 p-5"><div class="flex items-start justify-between"><div><p class="text-xs text-ink-3 font-medium">${label}</p><p class="text-2xl font-bold text-ink-1 mt-1">${value}</p>${subtitle?`<p class="text-xs text-ink-3 mt-1">${subtitle}</p>`:''}${trend?`<p class="text-xs mt-2 font-medium ${trendUp?'text-brand-600':'text-red-500'}">${trendUp?'↑':'↓'} ${trend}</p>`:''}</div><div class="text-2xl">${icon}</div></div></div>`;
  }

  // ========== CONTACTS ==========
  function renderContacts() {
    const sources = ['Event/Workshop','Content download','Social referral','App signup','Newsletter','Inbound Enterprise','Manual'];
    const personas = ['Founder','Student','Investor','Organization'];
    const tracks = ['Self-serve','Events','Enterprise'];
    const stages = ['Lead','Signed up','Activated','PQL','Pro customer','Registered','Attended','Re-engaged','In conversation','Qualified'];

    const filtered = contacts.filter(c => {
      if (filters.search) {
        const q = filters.search.toLowerCase();
        if (!c.name.toLowerCase().includes(q) && !c.email.toLowerCase().includes(q) && !(c.company||'').toLowerCase().includes(q)) return false;
      }
      if (filters.source && c.source !== filters.source) return false;
      if (filters.persona && c.persona !== filters.persona) return false;
      if (filters.track && c.track !== filters.track) return false;
      if (filters.stage && c.lifecycleStage !== filters.stage) return false;
      return true;
    });

    const hasF = filters.search||filters.source||filters.persona||filters.track||filters.stage;

    const sel = (id, opts, val) => `<select onchange="filters.${id}=this.value;renderContacts()" class="px-3 py-2 text-sm border border-surface-3 rounded-lg bg-surface-1 focus:outline-none focus:ring-2 focus:ring-brand-500"><option value="">All ${id==='stage'?'Stages':id.charAt(0).toUpperCase()+id.slice(1)+'s'}</option>${opts.map(o=>`<option value="${o}" ${val===o?'selected':''}>${o}</option>`).join('')}</select>`;

    document.getElementById('main').innerHTML = `
      <div class="p-8 fade-in">
        <div class="flex items-center justify-between mb-6">
          <div><h1 class="text-2xl font-bold text-ink-1">Contacts</h1><p class="text-sm text-ink-3 mt-1">${filtered.length} of ${contacts.length} contacts</p></div>
          <div class="flex gap-2">
            <button onclick="exportCSV(contacts.length===filtered.length?contacts:filtered, 'growthlab-contacts.csv')" class="px-4 py-2 text-sm bg-white border border-surface-3 rounded-lg text-ink-2 hover:bg-surface-2 transition-colors">📤 Export CSV</button>
            <button onclick="showAddContact()" class="px-4 py-2 text-sm bg-brand-600 text-white rounded-lg hover:bg-brand-700 transition-colors">+ Add Contact</button>
          </div>
        </div>
        <div class="bg-surface-0 rounded-xl border border-surface-3 p-4 mb-6">
          <div class="flex items-center gap-3 flex-wrap">
            <input type="text" placeholder="Search by name, email, or company..." value="${filters.search}" oninput="filters.search=this.value;renderContacts()" class="flex-1 min-w-[200px] px-3 py-2 text-sm border border-surface-3 rounded-lg bg-surface-1 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent">
            ${sel('source',sources,filters.source)}
            ${sel('persona',personas,filters.persona)}
            ${sel('track',tracks,filters.track)}
            ${sel('stage',stages,filters.stage)}
            ${hasF?`<button onclick="filters={search:'',source:'',persona:'',track:'',stage:''};renderContacts()" class="px-3 py-2 text-sm text-ink-3 hover:text-ink-1 transition-colors">Clear all</button>`:''}
          </div>
        </div>
        <div class="bg-surface-0 rounded-xl border border-surface-3 overflow-hidden">
          <table class="w-full text-sm">
            <thead><tr class="text-left text-xs text-ink-3 bg-surface-1 border-b border-surface-3"><th class="px-4 py-3">Contact</th><th class="px-4 py-3">Source</th><th class="px-4 py-3">Persona</th><th class="px-4 py-3">Track</th><th class="px-4 py-3">Stage</th><th class="px-4 py-3">Geography</th><th class="px-4 py-3">Last Active</th></tr></thead>
            <tbody>
              ${filtered.map(c=>`<tr onclick="showContact('${c.id}')" class="border-b border-surface-2 hover:bg-surface-1 cursor-pointer transition-colors">
                <td class="px-4 py-3"><div class="flex items-center gap-3"><div class="w-8 h-8 rounded-full bg-brand-100 flex items-center justify-center text-brand-700 text-xs font-semibold">${initials(c.name)}</div><div><div class="font-medium text-ink-1">${c.name}</div><div class="text-xs text-ink-3">${c.email}</div></div></div></td>
                <td class="px-4 py-3 text-ink-2">${c.source}</td>
                <td class="px-4 py-3"><span class="px-2 py-0.5 rounded-full text-xs bg-surface-2 text-ink-2">${c.persona}</span></td>
                <td class="px-4 py-3"><span class="px-2 py-0.5 rounded-full text-xs font-medium ${trackColor(c.track)}">${c.track}</span></td>
                <td class="px-4 py-3"><span class="text-xs font-medium text-ink-2">${c.lifecycleStage}</span></td>
                <td class="px-4 py-3 text-ink-3">${c.geography}</td>
                <td class="px-4 py-3 text-ink-3">${c.lastActivityDate}</td>
              </tr>`).join('')}
              ${filtered.length===0?'<tr><td colspan="7" class="px-4 py-12 text-center text-ink-3">No contacts match your filters</td></tr>':''}
            </tbody>
          </table>
        </div>
      </div>
    `;
  }

  // ========== PIPELINE ==========

    document.getElementById('main').innerHTML = `

      </div>
    `;
  }

    {id:'s4',name:'PQLs & Pro Customers',desc:'Product-qualified leads and paying customers',filter:c=>['PQL','Pro customer'].includes(c.lifecycleStage)},
    {id:'s5',name:'India Contacts',desc:'All contacts from India',filter:c=>c.geography==='India'},
    {id:'s6',name:'Event Attendees',desc:'People who attended GrowthLab events',filter:c=>c.track==='Events'},

              <div class="flex items-center justify-between mb-2"><h3 class="text-sm font-semibold text-ink-1">${s.name}</h3><span class="text-lg font-bold text-brand-600">${count}</span></div>

  // ========== IMPORT ==========
  const requiredFields = ['name','email'];
  const optionalFields = ['source','persona','track','lifecycleStage','geography','company','notes'];
  const allFields = [...requiredFields, ...optionalFields];
  const sourceOptions = ['Event/Workshop','Content download','Social referral','App signup','Newsletter','Inbound Enterprise','Manual'];

  function handleFileSelect(e) {
    const file = e.target.files[0];
    if (!file) return;
    processFile(file);
  }

  function handleDrop(e) {
    e.preventDefault();
    e.stopPropagation();
    const file = e.dataTransfer.files[0];
    if (file) processFile(file);
  }

  function processFile(file) {
    const reader = new FileReader();
    reader.onload = function(e) {
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, {type:'array'});
      const sheet = workbook.Sheets[workbook.SheetNames[0]];
      const json = XLSX.utils.sheet_to_json(sheet, {defval:''});
      if (json.length === 0) { alert('No data found in file'); return; }

      const headers = Object.keys(json[0]);
      // Auto-map columns
      const mapping = {};
      headers.forEach(h => {
        const lower = h.toLowerCase().replace(/[^a-z]/g,'');
        if (lower.includes('name') && !lower.includes('company')) mapping[h] = 'name';
        else if (lower.includes('email') || lower.includes('mail')) mapping[h] = 'email';
        else if (lower.includes('company') || lower.includes('organization') || lower.includes('org')) mapping[h] = 'company';
        else if (lower.includes('source') || lower.includes('channel')) mapping[h] = 'source';
        else if (lower.includes('persona') || lower.includes('type') || lower.includes('role')) mapping[h] = 'persona';
        else if (lower.includes('track') || lower.includes('pipeline')) mapping[h] = 'track';
        else if (lower.includes('stage') || lower.includes('lifecycle') || lower.includes('status')) mapping[h] = 'lifecycleStage';
        else if (lower.includes('country') || lower.includes('region') || lower.includes('geo') || lower.includes('location')) mapping[h] = 'geography';
        else if (lower.includes('note') || lower.includes('comment') || lower.includes('description')) mapping[h] = 'notes';
      });

      importState = { file, rows: json, headers, mapping, step:2, duplicates:0, preview:[] };
      renderImport();
    };
    reader.readAsArrayBuffer(file);
  }

  function updateMapping(header, field) {
    // Remove this field from any other header
    Object.keys(importState.mapping).forEach(k => {
      if (importState.mapping[k] === field && k !== header) delete importState.mapping[k];
    });
    if (field) importState.mapping[header] = field;
    else delete importState.mapping[header];
    renderImport();
  }

  function generatePreview() {
    const mapped = Object.entries(importState.mapping).filter(([_,v]) => v);
    if (!mapped.find(([_,v]) => v === 'email')) { alert('Email field is required for deduplication'); return; }
    if (!mapped.find(([_,v]) => v === 'name')) { alert('Name field is required'); return; }

    const existingEmails = new Set(contacts.map(c => c.email.toLowerCase()));
    let duplicates = 0;
    const preview = importState.rows.map((row, i) => {
      const contact = { id: 'imp_' + (Date.now()) + '_' + i, activities: [] };
      mapped.forEach(([header, field]) => {
        contact[field] = String(row[header] || '').trim();
      });
      // Defaults for required fields
      if (!contact.source) contact.source = 'Manual';
      if (!contact.persona) contact.persona = 'Founder';
      if (!contact.track) contact.track = 'Self-serve';
      if (!contact.lifecycleStage) contact.lifecycleStage = 'Lead';
      if (!contact.geography) contact.geography = '';
      contact.createdDate = new Date().toISOString().split('T')[0];
      contact.lastActivityDate = contact.createdDate;
      contact.notes = contact.notes || '';
      contact.activities = [{date:contact.createdDate, type:'import', desc:'Imported from '+(importState.file?.name||'file')}];

      const isDup = existingEmails.has(contact.email.toLowerCase());
      if (isDup) duplicates++;
      return { ...contact, _duplicate: isDup, _row: i + 2 };
    });

    importState.preview = preview;
    importState.duplicates = duplicates;
    importState.step = 3;
    renderImport();
  }

  function executeImport() {
    const newContacts = importState.preview.filter(c => !c._duplicate);
    newContacts.forEach(c => {
      delete c._duplicate;
      delete c._row;
      contacts.push(c);
    });
    importState = { file:null, rows:[], headers:[], mapping:{}, step:4, duplicates:importState.duplicates, preview:newContacts };
    renderImport();
    renderSidebar(); // Update counts
  }

  // ========== LUMA CONNECTOR ==========
  const LUMA_API = 'https://api.lu.ma';

  async function lumaFetch(endpoint, params = {}) {
    if (!lumaState.apiKey) throw new Error('API key required');
    const url = new URL(LUMA_API + endpoint);
    Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, v));
    const res = await fetch(url.toString(), {
      headers: { 'x-luma-api-key': lumaState.apiKey, 'Content-Type': 'application/json' }
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.message || `Luma API error: ${res.status}`);
    }
    return res.json();
  }

  async function lumaConnect() {
    lumaState.loading = true;
    lumaState.error = '';
    renderLuma();

    if (lumaState.demoMode) {
      // Demo mode: use mock data
      await new Promise(r => setTimeout(r, 800)); // Simulate loading
      lumaState.events = mockLumaEvents;
      lumaState.loading = false;
      lumaState.syncLog.push({ time: new Date().toLocaleTimeString(), msg: `[Demo] Connected — found ${lumaState.events.length} events` });
      renderLuma();
      return;
    }

    const key = document.getElementById('lumaApiKey')?.value?.trim();
    if (!key) { lumaState.error = 'Please enter your Luma API key'; lumaState.loading = false; renderLuma(); return; }
    lumaState.apiKey = key;
    localStorage.setItem('luma_api_key', key);
    try {
      const data = await lumaFetch('/v1/calendar/get-events');
      lumaState.events = (data.entries || data.events || []).map(e => ({
        apiId: e.api_id || e.event?.api_id || e.id,
        name: e.name || e.event?.name || 'Untitled Event',
        description: e.description || e.event?.description || '',
        startAt: e.start_at || e.event?.start_at || '',
        endAt: e.end_at || e.event?.end_at || '',
        url: e.url || e.event?.url || '',
        geoAddress: e.geo_address || e.event?.geo_address || 'Online',
        guestCount: e.guest_count || e.event?.guest_count || 0,
        coverUrl: e.cover_url || e.event?.cover_url || ''
      }));
      lumaState.loading = false;
      lumaState.syncLog.push({ time: new Date().toLocaleTimeString(), msg: `Connected — found ${lumaState.events.length} events` });
    } catch(e) {
      lumaState.loading = false;
      lumaState.error = e.message;
    }
    renderLuma();
  }

  async function lumaLoadAttendees(eventApiId, eventName) {
    lumaState.selectedEvent = eventName;
    lumaState.loading = true;
    lumaState.error = '';
    lumaState.attendees = [];
    renderLuma();

    if (lumaState.demoMode) {
      await new Promise(r => setTimeout(r, 600));
      const guests = mockLumaAttendees[eventApiId] || [];
      lumaState.attendees = guests.map(g => ({
        name: g.name,
        email: g.email,
        registeredAt: g.registered_at,
        approvedAt: g.approved_at,
        checkedIn: g.checked_in,
        eventName: eventName
      })).filter(g => g.email);
      lumaState.loading = false;
      lumaState.syncLog.push({ time: new Date().toLocaleTimeString(), msg: `[Demo] Loaded ${lumaState.attendees.length} attendees from "${eventName}"` });
      renderLuma();
      return;
    }

    try {
      let allGuests = [];
      let cursor = null;
      do {
        const params = { event_api_id: eventApiId, limit: '100' };
        if (cursor) params.cursor = cursor;
        const data = await lumaFetch('/v1/event/get-guests', params);
        const guests = data.guests || data.entries || [];
        allGuests = allGuests.concat(guests);
        cursor = data.next_cursor || null;
      } while (cursor);

      lumaState.attendees = allGuests.map(g => ({
        name: g.name || [g.first_name, g.last_name].filter(Boolean).join(' ') || 'Unknown',
        email: g.email || '',
        registeredAt: g.registered_at || g.created_at || '',
        approvedAt: g.approved_at || '',
        checkedIn: g.checked_in || false,
        eventName: eventName
      })).filter(g => g.email);

      lumaState.loading = false;
      lumaState.syncLog.push({ time: new Date().toLocaleTimeString(), msg: `Loaded ${lumaState.attendees.length} attendees from "${eventName}"` });
    } catch(e) {
      lumaState.loading = false;
      lumaState.error = e.message;
    }
    renderLuma();
  }

  function lumaImportAttendees() {
    const existingEmails = new Set(contacts.map(c => c.email.toLowerCase()));
    let imported = 0, skipped = 0;

    lumaState.attendees.forEach(a => {
      if (existingEmails.has(a.email.toLowerCase())) { skipped++; return; }

      const isRegistered = !!a.approvedAt;
      const isCheckedIn = a.checkedIn;
      let stage = 'Registered';
      if (isCheckedIn) stage = 'Attended';
      else if (!isRegistered) stage = 'Lead';

      const contact = {
        id: 'luma_' + Date.now() + '_' + imported,
        name: a.name,
        email: a.email,
        source: 'Event/Workshop',
        persona: 'Founder',
        track: 'Events',
        lifecycleStage: stage,
        geography: '',
        company: '',
        createdDate: a.registeredAt ? new Date(a.registeredAt).toISOString().split('T')[0] : new Date().toISOString().split('T')[0],
        lastActivityDate: a.approvedAt ? new Date(a.approvedAt).toISOString().split('T')[0] : new Date().toISOString().split('T')[0],
        notes: `Imported from Luma: ${a.eventName}`,
        activities: [
          { date: new Date().toISOString().split('T')[0], type: 'import', desc: `Imported from Luma event: ${a.eventName}` },
          { date: a.registeredAt ? new Date(a.registeredAt).toISOString().split('T')[0] : new Date().toISOString().split('T')[0], type: 'event', desc: `Registered for: ${a.eventName}` }
        ]
      };

      if (isCheckedIn) {
        contact.activities.push({ date: a.approvedAt ? new Date(a.approvedAt).toISOString().split('T')[0] : new Date().toISOString().split('T')[0], type: 'stage', desc: 'Registered → Attended (checked in via Luma)' });
      }

      contacts.push(contact);
      existingEmails.add(a.email.toLowerCase());
      imported++;
    });

    lumaState.imported += imported;
    lumaState.syncLog.push({ time: new Date().toLocaleTimeString(), msg: `Imported ${imported} contacts (${skipped} duplicates skipped)` });
    lumaState.selectedEvent = null;
    lumaState.attendees = [];
    renderLuma();
    renderSidebar();
  }

  function lumaDisconnect() {
    lumaState = { apiKey:'', events:[], selectedEvent:null, attendees:[], loading:false, error:'', imported:0, syncLog:[] };
    localStorage.removeItem('luma_api_key');
    renderLuma();
  }

  function renderLuma() {
    const { apiKey, events, selectedEvent, attendees, loading, error, imported, syncLog } = lumaState;
    // Auto-load demo data on first visit
    if (lumaState.demoMode && events.length === 0 && !loading) { lumaConnect(); return; }

    document.getElementById('main').innerHTML = `
      <div class="p-8 fade-in">
        <div class="mb-6">
          <h1 class="text-2xl font-bold text-ink-1">Luma Sync</h1>
          <p class="text-sm text-ink-3 mt-1">Connect your Luma account to auto-import event attendees</p>
        </div>

        ${error ? `<div class="bg-red-50 border border-red-200 rounded-xl p-4 mb-6"><p class="text-sm text-red-700">❌ ${error}</p></div>` : ''}

        <!-- Connection Card -->
        <div class="bg-surface-0 rounded-xl border border-surface-3 p-6 mb-6">
          <div class="flex items-center justify-between mb-4">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-lg bg-[#ff6b6b] flex items-center justify-center text-white text-lg">🎪</div>
              <div>
                <h3 class="text-sm font-semibold text-ink-1">Luma API Connection</h3>
                <p class="text-xs text-ink-3">${lumaState.demoMode ? '🧪 Demo Mode — using sample data' : (apiKey ? '✅ Connected' : 'Not connected')}</p>
              </div>
            </div>
            <div class="flex gap-2">
              ${lumaState.demoMode ? `<button onclick="lumaState.demoMode=false;lumaState.events=[];renderLuma()" class="text-xs text-ink-3 hover:text-ink-1 border border-surface-3 px-3 py-1.5 rounded-lg">Switch to Live</button>` : ''}
              ${apiKey ? `<button onclick="lumaDisconnect()" class="text-sm text-red-500 hover:text-red-700">Disconnect</button>` : ''}
            </div>
          </div>
          ${lumaState.demoMode ? `
            <div class="grid grid-cols-3 gap-4 mt-4">
              <div class="bg-surface-1 rounded-lg p-3 text-center">
                <div class="text-xl font-bold text-ink-1">${events.length}</div>
                <div class="text-xs text-ink-3">Events Found</div>
              </div>
              <div class="bg-surface-1 rounded-lg p-3 text-center">
                <div class="text-xl font-bold text-brand-600">${imported}</div>
                <div class="text-xs text-ink-3">Contacts Imported</div>
              </div>
              <div class="bg-surface-1 rounded-lg p-3 text-center">
                <div class="text-xl font-bold text-ink-1">${syncLog.length}</div>
                <div class="text-xs text-ink-3">Sync Actions</div>
              </div>
            </div>
          ` : (!apiKey ? `
            <div class="mt-4">
              <label class="text-xs font-medium text-ink-2 block mb-1">Luma API Key</label>
              <p class="text-xs text-ink-4 mb-3">Find your API key at <a href="https://lu.ma/settings" target="_blank" class="text-brand-600 underline">lu.ma/settings</a> → API section</p>
              <div class="flex gap-2">
                <input type="password" id="lumaApiKey" placeholder="Enter your Luma API key..." class="flex-1 px-3 py-2 text-sm border border-surface-3 rounded-lg bg-surface-1 focus:outline-none focus:ring-2 focus:ring-brand-500">
                <button onclick="lumaConnect()" class="px-6 py-2 text-sm bg-brand-600 text-white rounded-lg font-medium hover:bg-brand-700" ${loading?'disabled':''}>${loading?'Connecting...':'Connect'}</button>
              </div>
              <button onclick="lumaState.demoMode=true;lumaConnect()" class="mt-3 text-xs text-brand-600 hover:text-brand-700 underline">or try Demo Mode with sample data →</button>
            </div>
          ` : `
            <div class="grid grid-cols-3 gap-4 mt-4">
              <div class="bg-surface-1 rounded-lg p-3 text-center">
                <div class="text-xl font-bold text-ink-1">${events.length}</div>
                <div class="text-xs text-ink-3">Events Found</div>
              </div>
              <div class="bg-surface-1 rounded-lg p-3 text-center">
                <div class="text-xl font-bold text-brand-600">${imported}</div>
                <div class="text-xs text-ink-3">Contacts Imported</div>
              </div>
              <div class="bg-surface-1 rounded-lg p-3 text-center">
                <div class="text-xl font-bold text-ink-1">${syncLog.length}</div>
                <div class="text-xs text-ink-3">Sync Actions</div>
              </div>
            </div>
          `)}
        </div>

        ${apiKey && events.length > 0 ? `
          <!-- Events List -->
          <div class="bg-surface-0 rounded-xl border border-surface-3 overflow-hidden mb-6">
            <div class="px-5 py-4 bg-surface-1 border-b border-surface-3">
              <h3 class="text-sm font-semibold text-ink-1">Your Luma Events</h3>
              <p class="text-xs text-ink-3">Click an event to load attendees</p>
            </div>
            <div class="divide-y divide-surface-2">
              ${events.map(ev => `
                <div onclick="lumaLoadAttendees(this.dataset.eventId,this.dataset.eventName)" data-event-id="${ev.apiId}" data-event-name="${ev.name}" class="px-5 py-4 hover:bg-surface-1 cursor-pointer transition-colors">
                  <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                      ${ev.coverUrl ? `<img src="${ev.coverUrl}" class="w-10 h-10 rounded-lg object-cover">` : `<div class="w-10 h-10 rounded-lg bg-brand-100 flex items-center justify-center text-brand-700">🎪</div>`}
                      <div>
                        <div class="text-sm font-medium text-ink-1">${ev.name}</div>
                        <div class="text-xs text-ink-3">${ev.geoAddress || 'Online'} · ${ev.startAt ? new Date(ev.startAt).toLocaleDateString() : 'TBD'}</div>
                      </div>
                    </div>
                    <div class="flex items-center gap-3">
                      <span class="text-xs text-ink-3">${ev.guestCount} guests</span>
                      <span class="text-brand-600 text-sm">→</span>
                    </div>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>

          <button onclick="lumaConnect()" class="text-sm text-brand-600 hover:text-brand-700 font-medium">🔄 Refresh events</button>
        ` : ''}

        ${selectedEvent && attendees.length > 0 ? `
          <!-- Attendees Preview -->
          <div class="bg-surface-0 rounded-xl border border-surface-3 overflow-hidden mb-6">
            <div class="px-5 py-4 bg-surface-1 border-b border-surface-3 flex items-center justify-between">
              <div>
                <h3 class="text-sm font-semibold text-ink-1">Attendees: ${selectedEvent}</h3>
                <p class="text-xs text-ink-3">${attendees.length} attendees found</p>
              </div>
              <button onclick="lumaImportAttendees()" class="px-5 py-2 text-sm bg-brand-600 text-white rounded-lg font-medium hover:bg-brand-700">
                📥 Import ${attendees.length} Contacts
              </button>
            </div>
            <div class="max-h-80 overflow-y-auto">
              <table class="w-full text-sm">
                <thead class="sticky top-0 bg-surface-1"><tr class="text-left text-xs text-ink-3 border-b border-surface-3">
                  <th class="px-4 py-2">Name</th><th class="px-4 py-2">Email</th><th class="px-4 py-2">Status</th><th class="px-4 py-2">Registered</th>
                </tr></thead>
                <tbody>
                  ${attendees.slice(0,50).map(a => `
                    <tr class="border-b border-surface-2">
                      <td class="px-4 py-2 font-medium text-ink-1">${a.name}</td>
                      <td class="px-4 py-2 text-ink-3">${a.email}</td>
                      <td class="px-4 py-2">
                        ${a.checkedIn ? '<span class="text-xs px-2 py-0.5 rounded-full bg-brand-100 text-brand-700">✓ Checked in</span>' : '<span class="text-xs px-2 py-0.5 rounded-full bg-yellow-100 text-yellow-700">Registered</span>'}
                      </td>
                      <td class="px-4 py-2 text-xs text-ink-3">${a.registeredAt ? new Date(a.registeredAt).toLocaleDateString() : '—'}</td>
                    </tr>
                  `).join('')}
                  ${attendees.length > 50 ? `<tr><td colspan="4" class="px-4 py-2 text-center text-xs text-ink-4">... and ${attendees.length-50} more</td></tr>` : ''}
                </tbody>
              </table>
            </div>
          </div>
        ` : selectedEvent && !loading ? `<div class="bg-surface-0 rounded-xl border border-surface-3 p-8 text-center mb-6"><p class="text-ink-3">No attendees found for this event</p></div>` : ''}

        ${loading ? `<div class="text-center py-8"><div class="text-2xl mb-2">⏳</div><p class="text-sm text-ink-3">Loading from Luma...</p></div>` : ''}

        <!-- Sync Log -->
        ${syncLog.length > 0 ? `
          <div class="bg-surface-0 rounded-xl border border-surface-3 p-5">
            <h3 class="text-sm font-semibold text-ink-1 mb-3">Sync Log</h3>
            <div class="space-y-2 max-h-40 overflow-y-auto">
              ${syncLog.slice().reverse().map(l => `
                <div class="flex items-center gap-2 text-xs">
                  <span class="text-ink-4">${l.time}</span>
                  <span class="text-ink-2">${l.msg}</span>
                </div>
              `).join('')}
            </div>
          </div>
        ` : ''}

        <!-- API Info -->
        <div class="mt-6 bg-blue-50 border border-blue-200 rounded-xl p-4">
          <div class="flex items-start gap-3">
            <span class="text-lg">💡</span>
            <div>
              <h4 class="text-sm font-semibold text-blue-900">How Luma Sync Works</h4>
              <ul class="text-xs text-blue-700 mt-1 space-y-1">
                <li>• Connect your Luma account with an API key</li>
                <li>• View all your events and their guest lists</li>
                <li>• Click any event to load attendees</li>
                <li>• Import attendees as CRM contacts (with deduplication)</li>
                <li>• Checked-in guests → "Attended" stage automatically</li>
                <li>• Registered-only guests → "Registered" stage</li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  // ========== NAVIGATION ==========
  function navigate(page) {
    currentPage = page;
    renderSidebar();
    if (page === 'dashboard') renderDashboard();
    else if (page === 'contacts') renderContacts();
    else if (page === 'pipeline') renderPipeline();
    else if (page === 'segments') renderSegments();
    else if (page === 'import') renderImport();
    else if (page === 'luma') renderLuma();
  }

  // ========== INIT ==========
  renderSidebar();
  renderDashboard();
  </script>
</body>
</html>
