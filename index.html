  // ========== STATE ==========
  let currentPage = 'dashboard';

  // ========== HELPERS ==========
  const initials = name => name.split(' ').map(n=>n[0]).join('');
  const trackColor = t => t==='Self-serve'?'bg-brand-100 text-brand-700':t==='Events'?'bg-yellow-100 text-yellow-700':'bg-indigo-100 text-indigo-700';
  const trackDot = t => t==='Self-serve'?'bg-brand-500':t==='Events'?'bg-yellow-500':'bg-indigo-500';
  const stageBadge = s => {
    const m = {'Pro customer':'bg-brand-600 text-white','PQL':'bg-purple-100 text-purple-700','Qualified':'bg-brand-600 text-white','Activated':'bg-brand-100 text-brand-700','Re-engaged':'bg-brand-100 text-brand-700','In conversation':'bg-blue-100 text-blue-700','Attended':'bg-orange-100 text-orange-700','Registered':'bg-yellow-100 text-yellow-700','Signed up':'bg-blue-100 text-blue-700','Lead':'bg-gray-100 text-gray-600'};
    return m[s]||'bg-gray-100 text-gray-600';
  };
  const activityIcon = t => ({stage:'🔄',note:'📝',event:'🎪',import:'📥',login:'🔑'})[t]||'📌';

  // ========== RENDER SIDEBAR ==========
  function renderSidebar() {

  // ========== DASHBOARD ==========
  function renderDashboard() {
    const bySource = {}, byPersona = {}, byTrack = {}, byGeo = {};
    contacts.forEach(c => {
      bySource[c.source] = (bySource[c.source]||0)+1;
      byPersona[c.persona] = (byPersona[c.persona]||0)+1;
      byTrack[c.track] = (byTrack[c.track]||0)+1;
      byGeo[c.geography] = (byGeo[c.geography]||0)+1;
    });
    const newWeek = contacts.filter(c=>new Date(c.createdDate)>=new Date(daysAgo(7))).length;
    const activeEnt = contacts.filter(c=>c.track==='Enterprise'&&['In conversation','Qualified'].includes(c.lifecycleStage)).length;
    const pro = contacts.filter(c=>c.lifecycleStage==='Pro customer').length;

    const barHtml = (data, color) => {
      const max = Math.max(...Object.values(data),1);
      return Object.entries(data).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`
        <div><div class="flex justify-between text-xs mb-1"><span class="text-ink-2">${k}</span><span class="font-medium text-ink-1">${v}</span></div>
        <div class="w-full bg-surface-2 rounded-full h-2"><div class="h-2 rounded-full" style="width:${(v/max)*100}%;background:${color||'#22c55e'}"></div></div></div>
      `).join('');
    };

    const recent = [...contacts].sort((a,b)=>new Date(b.createdDate)-new Date(a.createdDate)).slice(0,5);

    document.getElementById('main').innerHTML = `
      <div class="p-8 fade-in">
        <div class="mb-8"><h1 class="text-2xl font-bold text-ink-1">Dashboard</h1><p class="text-sm text-ink-3 mt-1">Overview of all GrowthLab contacts and pipeline activity</p></div>
        <div class="grid grid-cols-4 gap-4 mb-8">
          ${statCard('Total Contacts',contacts.length,'All time','+8 this week',true,'👥')}
          ${statCard('New This Week',newWeek,'Last 7 days','+40% vs last week',true,'📈')}
          ${statCard('Enterprise Pipeline',activeEnt,'Active conversations','','','🏢')}
          ${statCard('Pro Customers',pro,'Paying subscribers','Growing',true,'⭐')}
        </div>
        <div class="grid grid-cols-2 gap-4 mb-8">
          <div class="bg-surface-0 rounded-xl border border-surface-3 p-5"><h3 class="text-sm font-semibold text-ink-1 mb-4">Contacts by Source</h3><div class="space-y-3">${barHtml(bySource)}</div></div>
          <div class="bg-surface-0 rounded-xl border border-surface-3 p-5"><h3 class="text-sm font-semibold text-ink-1 mb-4">Contacts by Track</h3><div class="space-y-3">${barHtml(byTrack,'#22c55e')}</div></div>
        </div>
        <div class="grid grid-cols-2 gap-4 mb-8">
          <div class="bg-surface-0 rounded-xl border border-surface-3 p-5"><h3 class="text-sm font-semibold text-ink-1 mb-4">Contacts by Persona</h3><div class="space-y-3">${barHtml(byPersona,'#6366f1')}</div></div>
          <div class="bg-surface-0 rounded-xl border border-surface-3 p-5"><h3 class="text-sm font-semibold text-ink-1 mb-4">Contacts by Geography</h3><div class="space-y-3">${barHtml(byGeo,'#f59e0b')}</div></div>
        </div>
        <div class="bg-surface-0 rounded-xl border border-surface-3 p-5">
          <h3 class="text-sm font-semibold text-ink-1 mb-4">Recent Contacts</h3>
          <table class="w-full text-sm"><thead><tr class="text-left text-xs text-ink-3 border-b border-surface-3"><th class="pb-2">Name</th><th class="pb-2">Source</th><th class="pb-2">Track</th><th class="pb-2">Stage</th><th class="pb-2">Added</th></tr></thead>
          <tbody>${recent.map(c=>`<tr class="border-b border-surface-2"><td class="py-2.5 font-medium text-ink-1">${c.name}</td><td class="py-2.5 text-ink-2">${c.source}</td><td class="py-2.5"><span class="px-2 py-0.5 rounded-full text-xs ${trackColor(c.track)}">${c.track}</span></td><td class="py-2.5"><span class="px-2 py-0.5 rounded-full text-xs ${stageBadge(c.lifecycleStage)}">${c.lifecycleStage}</span></td><td class="py-2.5 text-ink-3">${c.createdDate}</td></tr>`).join('')}</tbody></table>
        </div>
      </div>
    `;
  }

  function statCard(label,value,subtitle,trend,trendUp,icon) {
    return `<div class="bg-surface-0 rounded-xl border border-surface-3 p-5"><div class="flex items-start justify-between"><div><p class="text-xs text-ink-3 font-medium">${label}</p><p class="text-2xl font-bold text-ink-1 mt-1">${value}</p>${subtitle?`<p class="text-xs text-ink-3 mt-1">${subtitle}</p>`:''}${trend?`<p class="text-xs mt-2 font-medium ${trendUp?'text-brand-600':'text-red-500'}">${trendUp?'↑':'↓'} ${trend}</p>`:''}</div><div class="text-2xl">${icon}</div></div></div>`;
  }

  // ========== CONTACTS ==========
  function renderContacts() {
    const sources = ['Event/Workshop','Content download','Social referral','App signup','Newsletter','Inbound Enterprise','Manual'];
    const personas = ['Founder','Student','Investor','Organization'];
    const tracks = ['Self-serve','Events','Enterprise'];
    const stages = ['Lead','Signed up','Activated','PQL','Pro customer','Registered','Attended','Re-engaged','In conversation','Qualified'];

    const filtered = contacts.filter(c => {
      if (filters.search) {
        const q = filters.search.toLowerCase();
        if (!c.name.toLowerCase().includes(q) && !c.email.toLowerCase().includes(q) && !(c.company||'').toLowerCase().includes(q)) return false;
      }
      if (filters.source && c.source !== filters.source) return false;
      if (filters.persona && c.persona !== filters.persona) return false;
      if (filters.track && c.track !== filters.track) return false;
      if (filters.stage && c.lifecycleStage !== filters.stage) return false;
      return true;
    });

    const hasF = filters.search||filters.source||filters.persona||filters.track||filters.stage;

    const sel = (id, opts, val) => `<select onchange="filters.${id}=this.value;renderContacts()" class="px-3 py-2 text-sm border border-surface-3 rounded-lg bg-surface-1 focus:outline-none focus:ring-2 focus:ring-brand-500"><option value="">All ${id==='stage'?'Stages':id.charAt(0).toUpperCase()+id.slice(1)+'s'}</option>${opts.map(o=>`<option value="${o}" ${val===o?'selected':''}>${o}</option>`).join('')}</select>`;

    document.getElementById('main').innerHTML = `
      <div class="p-8 fade-in">
        <div class="flex items-center justify-between mb-6">
          <div><h1 class="text-2xl font-bold text-ink-1">Contacts</h1><p class="text-sm text-ink-3 mt-1">${filtered.length} of ${contacts.length} contacts</p></div>
          <div class="flex gap-2">
            <button class="px-4 py-2 text-sm bg-white border border-surface-3 rounded-lg text-ink-2 hover:bg-surface-2 transition-colors">📤 Export CSV</button>
            <button class="px-4 py-2 text-sm bg-brand-600 text-white rounded-lg hover:bg-brand-700 transition-colors">+ Add Contact</button>
          </div>
        </div>
        <div class="bg-surface-0 rounded-xl border border-surface-3 p-4 mb-6">
          <div class="flex items-center gap-3 flex-wrap">
            <input type="text" placeholder="Search by name, email, or company..." value="${filters.search}" oninput="filters.search=this.value;renderContacts()" class="flex-1 min-w-[200px] px-3 py-2 text-sm border border-surface-3 rounded-lg bg-surface-1 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent">
            ${sel('source',sources,filters.source)}
            ${sel('persona',personas,filters.persona)}
            ${sel('track',tracks,filters.track)}
            ${sel('stage',stages,filters.stage)}
            ${hasF?`<button onclick="filters={search:'',source:'',persona:'',track:'',stage:''};renderContacts()" class="px-3 py-2 text-sm text-ink-3 hover:text-ink-1 transition-colors">Clear all</button>`:''}
          </div>
        </div>
        <div class="bg-surface-0 rounded-xl border border-surface-3 overflow-hidden">
          <table class="w-full text-sm">
            <thead><tr class="text-left text-xs text-ink-3 bg-surface-1 border-b border-surface-3"><th class="px-4 py-3">Contact</th><th class="px-4 py-3">Source</th><th class="px-4 py-3">Persona</th><th class="px-4 py-3">Track</th><th class="px-4 py-3">Stage</th><th class="px-4 py-3">Geography</th><th class="px-4 py-3">Last Active</th></tr></thead>
            <tbody>
              ${filtered.map(c=>`<tr onclick="showContact('${c.id}')" class="border-b border-surface-2 hover:bg-surface-1 cursor-pointer transition-colors">
                <td class="px-4 py-3"><div class="flex items-center gap-3"><div class="w-8 h-8 rounded-full bg-brand-100 flex items-center justify-center text-brand-700 text-xs font-semibold">${initials(c.name)}</div><div><div class="font-medium text-ink-1">${c.name}</div><div class="text-xs text-ink-3">${c.email}</div></div></div></td>
                <td class="px-4 py-3 text-ink-2">${c.source}</td>
                <td class="px-4 py-3"><span class="px-2 py-0.5 rounded-full text-xs bg-surface-2 text-ink-2">${c.persona}</span></td>
                <td class="px-4 py-3"><span class="px-2 py-0.5 rounded-full text-xs font-medium ${trackColor(c.track)}">${c.track}</span></td>
                <td class="px-4 py-3"><span class="text-xs font-medium text-ink-2">${c.lifecycleStage}</span></td>
                <td class="px-4 py-3 text-ink-3">${c.geography}</td>
                <td class="px-4 py-3 text-ink-3">${c.lastActivityDate}</td>
              </tr>`).join('')}
              ${filtered.length===0?'<tr><td colspan="7" class="px-4 py-12 text-center text-ink-3">No contacts match your filters</td></tr>':''}
            </tbody>
          </table>
        </div>
      </div>
    `;
  }

  // ========== PIPELINE ==========
  function renderPipeline() {
    const trackStages = {'Self-serve':['Lead','Signed up','Activated','PQL','Pro customer'],'Events':['Lead','Registered','Attended','Re-engaged'],'Enterprise':['Lead','In conversation','Qualified']};
    const trackBtnColors = {'Self-serve':'#22c55e','Events':'#f59e0b','Enterprise':'#6366f1'};
    const stages = trackStages[activeTrack];
    const trackContacts = contacts.filter(c=>c.track===activeTrack);

    document.getElementById('main').innerHTML = `
      <div class="p-8 fade-in">
        <div class="mb-6"><h1 class="text-2xl font-bold text-ink-1">Pipeline</h1><p class="text-sm text-ink-3 mt-1">Visual pipeline for each GrowthLab track</p></div>
        <div class="flex gap-2 mb-6">
          ${Object.keys(trackStages).map(t=>`<button onclick="activeTrack='${t}';renderPipeline()" class="px-4 py-2 text-sm rounded-lg font-medium transition-colors ${activeTrack===t?'text-white':'bg-surface-0 border border-surface-3 text-ink-2 hover:bg-surface-2'}" ${activeTrack===t?`style="background:${trackBtnColors[t]}"`:''}>${t} (${contacts.filter(c=>c.track===t).length})</button>`).join('')}
        </div>
        <div class="flex gap-4 overflow-x-auto pb-4">
          ${stages.map(stage=>{
            const sc = trackContacts.filter(c=>c.lifecycleStage===stage);
            return `<div class="flex-shrink-0 w-72 bg-surface-2 rounded-xl p-3">
              <div class="flex items-center justify-between mb-3 px-1"><h3 class="text-sm font-semibold text-ink-1">${stage}</h3><span class="text-xs bg-surface-0 text-ink-3 px-2 py-0.5 rounded-full font-medium">${sc.length}</span></div>
              <div class="space-y-2">
                ${sc.map(c=>`<div onclick="showContact('${c.id}')" class="bg-surface-0 rounded-lg p-3 cursor-pointer hover:shadow-md transition-shadow border border-surface-3">
                  <div class="flex items-center gap-2 mb-2"><div class="w-7 h-7 rounded-full bg-brand-100 flex items-center justify-center text-brand-700 text-[10px] font-semibold">${initials(c.name)}</div><div><div class="text-sm font-medium text-ink-1">${c.name}</div><div class="text-[11px] text-ink-3">${c.company||c.email}</div></div></div>
                  <div class="flex items-center gap-2"><span class="text-[10px] px-2 py-0.5 rounded-full bg-surface-2 text-ink-3">${c.source}</span><span class="text-[10px] px-2 py-0.5 rounded-full bg-surface-2 text-ink-3">${c.geography}</span></div>
                </div>`).join('')}
                ${sc.length===0?'<div class="text-center py-6 text-xs text-ink-4">No contacts</div>':''}
              </div>
            </div>`;
          }).join('')}
        </div>
        ${activeTrack==='Enterprise'?`<div class="mt-6 bg-indigo-50 border border-indigo-200 rounded-xl p-4"><div class="flex items-start gap-3"><span class="text-lg">🔜</span><div><h4 class="text-sm font-semibold text-indigo-900">Enterprise Pipeline — v2 Roadmap</h4><p class="text-xs text-indigo-700 mt-1">Future versions will add deal values, forecasting, quota tracking, and stage exit criteria. This view captures and categorizes Enterprise contacts so none are lost.</p></div></div></div>`:''}
      </div>
    `;
  }

  // ========== SEGMENTS ==========
  const presetSegments = [
    {id:'s1',name:'All Founders',desc:'Every founder across all tracks',filter:c=>c.persona==='Founder'},
    {id:'s2',name:'Enterprise Pipeline',desc:'Active Enterprise conversations',filter:c=>c.track==='Enterprise'},
    {id:'s3',name:'Singapore Investors',desc:'Investors based in Singapore',filter:c=>c.persona==='Investor'&&c.geography==='Singapore'},
    {id:'s4',name:'PQLs & Pro Customers',desc:'Product-qualified leads and paying customers',filter:c=>['PQL','Pro customer'].includes(c.lifecycleStage)},
    {id:'s5',name:'India Contacts',desc:'All contacts from India',filter:c=>c.geography==='India'},
    {id:'s6',name:'Event Attendees',desc:'People who attended GrowthLab events',filter:c=>c.track==='Events'},
  ];

  function renderSegments() {
    const seg = activeSegment?presetSegments.find(s=>s.id===activeSegment):null;
    const segContacts = seg?contacts.filter(seg.filter):[];

    document.getElementById('main').innerHTML = `
      <div class="p-8 fade-in">
        <div class="flex items-center justify-between mb-6">
          <div><h1 class="text-2xl font-bold text-ink-1">Segments</h1><p class="text-sm text-ink-3 mt-1">Pre-built segments for common GrowthLab queries</p></div>
          <button class="px-4 py-2 text-sm bg-brand-600 text-white rounded-lg hover:bg-brand-700 transition-colors">+ Create Segment</button>
        </div>
        <div class="grid grid-cols-3 gap-4 mb-6">
          ${presetSegments.map(s=>{
            const count = contacts.filter(s.filter).length;
            return `<button onclick="activeSegment=activeSegment==='${s.id}'?null:'${s.id}';renderSegments()" class="text-left p-4 rounded-xl border transition-all ${activeSegment===s.id?'border-brand-500 bg-brand-50 ring-2 ring-brand-200':'border-surface-3 bg-surface-0 hover:border-brand-300'}">
              <div class="flex items-center justify-between mb-2"><h3 class="text-sm font-semibold text-ink-1">${s.name}</h3><span class="text-lg font-bold text-brand-600">${count}</span></div>
              <p class="text-xs text-ink-3">${s.desc}</p>
            </button>`;
          }).join('')}
        </div>
        ${seg?`
          <div class="bg-surface-0 rounded-xl border border-surface-3 overflow-hidden">
            <div class="px-4 py-3 bg-surface-1 border-b border-surface-3 flex items-center justify-between">
              <h3 class="text-sm font-semibold text-ink-1">${seg.name} — ${segContacts.length} contacts</h3>
              <button class="text-xs text-brand-600 hover:text-brand-700 font-medium">📤 Export to CSV</button>
            </div>
            <table class="w-full text-sm">
              <thead><tr class="text-left text-xs text-ink-3 border-b border-surface-3"><th class="px-4 py-2">Contact</th><th class="px-4 py-2">Source</th><th class="px-4 py-2">Track</th><th class="px-4 py-2">Stage</th><th class="px-4 py-2">Geography</th></tr></thead>
              <tbody>${segContacts.map(c=>`<tr onclick="showContact('${c.id}')" class="border-b border-surface-2 hover:bg-surface-1 cursor-pointer">
                <td class="px-4 py-2.5"><div class="font-medium text-ink-1">${c.name}</div><div class="text-xs text-ink-3">${c.email}</div></td>
                <td class="px-4 py-2.5 text-ink-2">${c.source}</td>
                <td class="px-4 py-2.5"><span class="text-xs px-2 py-0.5 rounded-full ${trackColor(c.track)}">${c.track}</span></td>
                <td class="px-4 py-2.5 text-xs font-medium text-ink-2">${c.lifecycleStage}</td>
                <td class="px-4 py-2.5 text-ink-3">${c.geography}</td>
              </tr>`).join('')}</tbody>
            </table>
          </div>
        `:''}
        <div class="mt-6 bg-surface-0 border border-surface-3 rounded-xl p-4">
          <div class="flex items-start gap-3"><span class="text-lg">🎯</span><div><h4 class="text-sm font-semibold text-ink-1">Custom Segments — Coming in v1.1</h4><p class="text-xs text-ink-3 mt-1">Build your own segments with a visual filter builder. Combine any combination of source, persona, track, stage, and geography to create custom views of your contact database.</p></div></div>
        </div>
      </div>
    `;
  }

  // ========== MODAL ==========
  function showContact(id) {
    const c = contacts.find(x=>x.id===id);
    if(!c) return;
    document.getElementById('modal-content').innerHTML = `
      <div class="p-6 border-b border-surface-3">
        <div class="flex items-start justify-between">
          <div class="flex items-center gap-4">
            <div class="w-12 h-12 rounded-full bg-brand-100 flex items-center justify-center text-brand-700 font-semibold text-lg">${initials(c.name)}</div>
            <div><h2 class="text-lg font-semibold text-ink-1">${c.name}</h2><p class="text-sm text-ink-3">${c.email}</p>${c.company?`<p class="text-xs text-ink-4 mt-0.5">${c.company} · ${c.geography}</p>`:''}</div>
          </div>
          <button onclick="closeModal()" class="text-ink-3 hover:text-ink-1 transition-colors text-xl">✕</button>
        </div>
      </div>
      <div class="p-6 border-b border-surface-3">
        <div class="flex flex-wrap gap-2">
          <span class="px-3 py-1 rounded-full text-xs font-medium bg-surface-2 text-ink-2">${c.source}</span>
          <span class="px-3 py-1 rounded-full text-xs font-medium bg-surface-2 text-ink-2">${c.persona}</span>
          <span class="px-3 py-1 rounded-full text-xs font-medium bg-surface-2 text-ink-2">${c.track}</span>
          <span class="px-3 py-1 rounded-full text-xs font-medium ${stageBadge(c.lifecycleStage)}">${c.lifecycleStage}</span>
        </div>
      </div>
      ${c.notes?`<div class="p-6 border-b border-surface-3"><h3 class="text-xs font-semibold text-ink-3 uppercase tracking-wide mb-2">Notes</h3><p class="text-sm text-ink-2">${c.notes}</p></div>`:''}
      <div class="p-6">
        <h3 class="text-xs font-semibold text-ink-3 uppercase tracking-wide mb-3">Activity Log</h3>
        <div class="space-y-3">
          ${[...c.activities].sort((a,b)=>new Date(b.date)-new Date(a.date)).map(a=>`
            <div class="flex items-start gap-3 text-sm">
              <span class="text-base mt-0.5">${activityIcon(a.type)}</span>
              <div class="flex-1"><p class="text-ink-2">${a.desc}</p><p class="text-xs text-ink-4">${a.date}</p></div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
    document.getElementById('modal').classList.remove('hidden');
  }

  function closeModal() {
    document.getElementById('modal').classList.add('hidden');
  }

  document.getElementById('modal').addEventListener('click', e => {
    if (e.target === document.getElementById('modal')) closeModal();
  });

  // ========== NAVIGATION ==========
  function navigate(page) {
    currentPage = page;
    renderSidebar();
    if (page === 'dashboard') renderDashboard();
    else if (page === 'contacts') renderContacts();
    else if (page === 'pipeline') renderPipeline();
    else if (page === 'segments') renderSegments();
  }

  // ========== INIT ==========
  renderSidebar();
  renderDashboard();
  </script>
</body>
</html>
